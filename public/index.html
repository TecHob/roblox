<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Map Architect</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --border: #30363d;
  --text: #c9d1d9; --text2: #8b949e; --text3: #484f58;
  --accent: #58a6ff; --green: #238636; --green2: #3fb950;
  --red: #f85149; --orange: #f0883e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

.header { background: linear-gradient(135deg, var(--bg2), #1a2332); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--green2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.version { font-size: 11px; color: var(--text3); margin-left: auto; }

.main { display: flex; height: calc(100vh - 49px); }

/* Sidebar */
.sidebar { width: 320px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px; flex-shrink: 0; }
.section { margin-bottom: 16px; }
.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text2); margin-bottom: 8px; }
.label { font-size: 12px; color: var(--text2); margin-bottom: 4px; display: block; }

input[type="number"], input[type="text"], select {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 13px;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }

.presets { display: flex; flex-wrap: wrap; gap: 4px; }
.preset-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer; font-size: 12px; transition: all 0.15s; }
.preset-btn.active, .preset-btn:hover { border-color: var(--accent); color: var(--accent); background: #1a2744; }

.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
.toggle { width: 36px; height: 20px; border-radius: 10px; background: var(--border); cursor: pointer; position: relative; border: none; transition: background 0.2s; }
.toggle.on { background: var(--green); }
.toggle::after { content: ''; width: 16px; height: 16px; border-radius: 8px; background: #fff; position: absolute; top: 2px; left: 2px; transition: left 0.2s; }
.toggle.on::after { left: 18px; }

.seed-row { display: flex; gap: 6px; margin-bottom: 8px; }
.seed-row input { flex: 1; }
.btn-dice { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; font-size: 14px; }

.btn-generate { width: 100%; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--green), #2ea043); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; transition: transform 0.1s; }
.btn-generate:hover { transform: scale(1.02); }
.btn-generate:disabled { background: var(--bg2); color: var(--text3); transform: none; cursor: default; }

.progress { width: 100%; height: 6px; background: var(--bg2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green2)); border-radius: 3px; transition: width 0.15s; }

.stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; }
.stat-val { color: var(--accent); font-weight: 700; font-size: 14px; display: block; }

/* Content */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
.tab { padding: 10px 20px; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg); }
.tab-body { flex: 1; overflow: auto; padding: 16px; }

canvas#previewCanvas { display: block; }

.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.toolbar span { font-size: 13px; color: var(--text2); }
.btn-copy { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; }
.btn-copy:hover { border-color: var(--accent); }

pre.code { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 11px; font-family: 'Cascadia Code', 'Fira Code', monospace; color: var(--text); overflow: auto; white-space: pre; max-height: calc(100vh - 160px); line-height: 1.5; }

.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }

.legend { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text2); }
.legend-color { width: 10px; height: 10px; border-radius: 2px; }

/* Maps list */
.map-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
.map-card:hover { border-color: var(--accent); }
.map-card h4 { font-size: 14px; margin-bottom: 4px; }
.map-card .meta { font-size: 11px; color: var(--text2); }

.db-status { font-size: 11px; padding: 4px 8px; border-radius: 4px; }
.db-status.ok { background: #0d2818; color: var(--green2); }
.db-status.err { background: #2d1215; color: var(--red); }

/* 3D Preview */
.view-toggle { display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.view-toggle button { padding:4px 14px; border:none; background:transparent; color:var(--text2); cursor:pointer; font-size:12px; font-weight:700; transition:all 0.15s; }
.view-toggle button.active { background:var(--accent); color:#fff; }
#canvas3DContainer { width:100%; aspect-ratio:1; max-width:600px; margin:0 auto; border-radius:8px; border:1px solid var(--border); overflow:hidden; background:#0a0e14; cursor:grab; }
#canvas3DContainer:active { cursor:grabbing; }
#canvas3DContainer canvas { display:block; width:100%!important; height:100%!important; }
.hint-3d { text-align:center; margin-top:6px; font-size:11px; color:var(--text3); }
.loading-3d { display:flex; align-items:center; justify-content:center; width:100%; aspect-ratio:1; max-width:600px; margin:0 auto; border-radius:8px; border:1px solid var(--border); background:#0a0e14; color:var(--text2); font-size:14px; }

/* ═══ RESPONSIVO ═══ */

/* Tablet */
@media (max-width: 1024px) {
  .sidebar { width: 280px; }
}

/* Mobile */
@media (max-width: 768px) {
  .header { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
  .logo { font-size: 16px; }
  .version { display: none; }

  .main { flex-direction: column; height: auto; min-height: calc(100vh - 49px); }

  .sidebar {
    width: 100%; max-height: none; height: auto;
    border-right: none; border-bottom: 1px solid var(--border);
    order: 2;
  }

  .content { order: 1; min-height: 50vh; }

  .tabs { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  .tab { padding: 10px 14px; font-size: 12px; flex-shrink: 0; }
  .tab-body { padding: 12px; }

  pre.code { font-size: 10px; padding: 10px; max-height: 60vh; }

  .presets { gap: 6px; }
  .preset-btn { padding: 8px 12px; font-size: 13px; }

  .stats { justify-content: center; }

  .btn-generate { padding: 14px; font-size: 15px; }
}

/* Mobile pequeno */
@media (max-width: 420px) {
  .header { padding: 8px 10px; }
  .logo { font-size: 14px; }
  .sidebar { padding: 10px; }
  .section-title { font-size: 10px; }
  .tab { padding: 8px 10px; font-size: 11px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="header">
  <span class="logo">ROBLOX MAP ARCHITECT</span>
  <span class="db-status" id="dbStatus">⏳ Verificando BD...</span>
  <span class="version">v1.0 — PHP Backend</span>
</div>

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="section">
      <div class="section-title">Preset do Mapa</div>
      <div class="presets" id="presetBtns"></div>
    </div>

    <div class="section">
      <div class="section-title">Tamanho</div>
      <select id="cfgSize" onchange="updateConfig('size', this.value)">
        <option value="tiny">Tiny — 256×256 studs</option>
        <option value="small">Small — 512×512 studs</option>
        <option value="medium" selected>Medium — 1024×1024 studs</option>
        <option value="large">Large — 2048×2048 studs</option>
        <option value="epic">Epic — 4096×4096 studs</option>
      </select>
      <div class="stats" id="sizeStats"></div>
    </div>

    <div class="section">
      <div class="section-title">Terreno</div>
      <label class="label">Seed</label>
      <div class="seed-row">
        <input type="number" id="cfgSeed" value="42" onchange="updateConfig('seed', +this.value); renderPreview()">
        <button class="btn-dice" onclick="randomSeed()">🎲</button>
      </div>
      <label class="label" id="lblAmplitude">Amplitude: 0.70</label>
      <input type="range" id="cfgAmplitude" min="0.1" max="1" step="0.05" value="0.7" oninput="updateSlider('amplitude', this)">
      <label class="label" id="lblWaterLevel">Nível d'água: 30%</label>
      <input type="range" id="cfgWaterLevel" min="0" max="0.6" step="0.02" value="0.3" oninput="updateSlider('waterLevel', this)">
      <label class="label" id="lblOctaves">Octaves: 6</label>
      <input type="range" id="cfgOctaves" min="1" max="8" step="1" value="6" oninput="updateSlider('octaves', this)">
      <label class="label" id="lblScale">Escala: 0.008</label>
      <input type="range" id="cfgScale" min="0.002" max="0.02" step="0.001" value="0.008" oninput="updateSlider('scale', this)">
    </div>

    <div class="section">
      <div class="section-title">Montanhas</div>
      <label class="label" id="lblMountainThreshold">Limiar: 0.60</label>
      <input type="range" id="cfgMountainThreshold" min="0.3" max="0.9" step="0.05" value="0.6" oninput="updateSlider('mountainThreshold', this)">
      <label class="label" id="lblMountainAmplitude">Amplitude: 0.40</label>
      <input type="range" id="cfgMountainAmplitude" min="0.1" max="1" step="0.05" value="0.4" oninput="updateSlider('mountainAmplitude', this)">
    </div>

    <div class="section">
      <div class="section-title">Features</div>
      <div class="toggle-row"><span>🏝️ Modo Ilha</span><button class="toggle on" id="togIslandMode" onclick="toggleFeature('islandMode', this)"></button></div>
      <div class="toggle-row"><span>🌊 Rios</span>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn-dice" onclick="randomFeature('riverSeed')" title="Randomizar padrão">🎲</button>
          <button class="toggle on" id="togRivers" onclick="toggleFeature('rivers', this)"></button>
        </div>
      </div>
      <div class="toggle-row"><span>🕳️ Cavernas</span>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn-dice" onclick="randomFeature('caveSeed')" title="Randomizar padrão">🎲</button>
          <button class="toggle" id="togCavesEnabled" onclick="toggleFeature('cavesEnabled', this)"></button>
        </div>
      </div>
      <div id="caveOptions" style="display:none;padding:0 0 8px 20px">
        <label class="label" id="lblCaveThreshold">Densidade cavernas: 0.65</label>
        <input type="range" style="accent-color:var(--accent);width:100%" min="0.4" max="0.85" step="0.05" value="0.65" oninput="config.caveThreshold=+this.value;document.getElementById('lblCaveThreshold').textContent='Densidade cavernas: '+this.value;renderPreview()">
      </div>
      <div class="toggle-row"><span>🌋 Vulcão</span><button class="toggle" id="togVolcano" onclick="toggleFeature('volcano', this)"></button></div>
      <div class="toggle-row"><span>🌳 Árvores</span>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn-dice" onclick="randomFeature('treeSeed')" title="Randomizar padrão">🎲</button>
          <button class="toggle on" id="togPlaceTrees" onclick="toggleFeature('placeTrees', this)"></button>
        </div>
      </div>
      <div id="treeOptions" style="display:block;padding:0 0 8px 20px">
        <label class="label" id="lblTreeDensity">Densidade: 0.020</label>
        <input type="range" id="cfgTreeDensity" style="accent-color:#3fb950;width:100%" min="0.001" max="0.08" step="0.002" value="0.02" oninput="config.treeDensity=+this.value;document.getElementById('lblTreeDensity').textContent='Densidade: '+parseFloat(this.value).toFixed(3);renderPreview()">
      </div>
      <div class="toggle-row"><span>🪨 Pedras</span>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn-dice" onclick="randomFeature('rockSeed')" title="Randomizar padrão">🎲</button>
          <button class="toggle on" id="togPlaceRocks" onclick="toggleFeature('placeRocks', this)"></button>
        </div>
      </div>
      <div id="rockOptions" style="display:block;padding:0 0 8px 20px">
        <label class="label" id="lblRockDensity">Densidade: 0.005</label>
        <input type="range" id="cfgRockDensity" style="accent-color:#8b949e;width:100%" min="0.001" max="0.03" step="0.001" value="0.005" oninput="config.rockDensity=+this.value;document.getElementById('lblRockDensity').textContent='Densidade: '+parseFloat(this.value).toFixed(3);renderPreview()">
      </div>
    </div>

    <div class="section" style="text-align:center;padding:4px 0">
      <button class="btn-dice" onclick="randomAllFeatures()" style="width:100%;padding:8px;font-size:12px;background:var(--bg);border:1px dashed var(--border)">🎲 Randomizar tudo (terreno + features)</button>
    </div>

    <div class="section">
      <label class="label">Nome do mapa</label>
      <input type="text" id="mapName" placeholder="Meu Mapa Incrível">
    </div>

    <button class="btn-generate" id="btnGenerate" onclick="generateMap()">⚡ GERAR MAPA</button>
    <div class="progress" id="progressBar" style="display:none"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('preview', this)">🗺️ Preview</div>
      <div class="tab" onclick="switchTab('lua', this)">📜 Lua Script</div>
      <div class="tab" onclick="switchTab('json', this)">📦 Config JSON</div>
      <div class="tab" onclick="switchTab('history', this)">📋 Histórico</div>
    </div>

    <div class="tab-body" id="tabContent">
      <!-- Preenchido por JS -->
    </div>
  </div>
</div>

<script>
// ═══ API URL ═══
// ═══ API URL ═══
const API = 'https://precisao.agr.br/apis/roblox/mapa/';

// ═══ Estado ═══
let config = {
  preset: 'tropical', size: 'medium', seed: 42, scale: 0.008, octaves: 6,
  lacunarity: 2.0, gain: 0.5, waterLevel: 0.3, amplitude: 0.7,
  mountainThreshold: 0.6, mountainAmplitude: 0.4, cavesEnabled: false,
  caveThreshold: 0.65, rivers: true, volcano: false, islandMode: true,
  placeTrees: true, treeDensity: 0.02, placeRocks: true, rockDensity: 0.005,
  lighting: 'tropical',
  // Seeds individuais por feature (permite randomizar cada um separado)
  treeSeed: 7777, rockSeed: 8888, caveSeed: 9999, riverSeed: 333,
};

let generatedLua = '';
let generatedJSON = '';
let currentTab = 'preview';
let is3D = false;
let scene3D = null, camera3D = null, renderer3D = null, animFrame3D = null;

const PRESETS = {
  tropical: { name:'🏝️ Tropical', waterLevel:0.3, amplitude:0.7, rivers:true, cavesEnabled:false, volcano:false, islandMode:true },
  medieval: { name:'🏰 Medieval', waterLevel:0.25, amplitude:0.6, rivers:true, cavesEnabled:true, volcano:false, islandMode:false },
  volcanic: { name:'🌋 Vulcânico', waterLevel:0.1, amplitude:0.9, rivers:false, cavesEnabled:true, volcano:true, islandMode:true },
  arctic:   { name:'❄️ Ártico', waterLevel:0.2, amplitude:0.65, rivers:false, cavesEnabled:false, volcano:false, islandMode:false },
  desert:   { name:'🏜️ Deserto', waterLevel:0.05, amplitude:0.55, rivers:false, cavesEnabled:false, volcano:false, islandMode:false },
  skylands: { name:'🏔️ Skylands', waterLevel:0, amplitude:0.8, rivers:false, cavesEnabled:false, volcano:false, islandMode:true },
  custom:   { name:'⚙️ Custom' },
};

const SIZES = { tiny:[64,256], small:[128,512], medium:[256,1024], large:[512,2048], epic:[1024,4096] };

// ═══ Perlin Noise ═══
class Perlin {
  constructor(seed=42) {
    this.p = new Uint8Array(512);
    const pm = new Uint8Array(256);
    for(let i=0;i<256;i++) pm[i]=i;
    let s=seed;
    for(let i=255;i>0;i--){ s=(s*16807)%2147483647; const j=s%(i+1); [pm[i],pm[j]]=[pm[j],pm[i]]; }
    for(let i=0;i<512;i++) this.p[i]=pm[i&255];
  }
  fade(t){return t*t*t*(t*(t*6-15)+10)}
  lerp(a,b,t){return a+t*(b-a)}
  grad(h,x,y){const g=h&3,u=g<2?x:y,v=g<2?y:x;return((g&1)?-u:u)+((g&2)?-v:v)}
  noise(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255,xf=x-Math.floor(x),yf=y-Math.floor(y);
    const u=this.fade(xf),v=this.fade(yf),p=this.p,a=p[X]+Y,b=p[X+1]+Y;
    return this.lerp(this.lerp(this.grad(p[a],xf,yf),this.grad(p[b],xf-1,yf),u),
      this.lerp(this.grad(p[a+1],xf,yf-1),this.grad(p[b+1],xf-1,yf-1),u),v);
  }
  fbm(x,y,oct=6,lac=2,gain=0.5){
    let t=0,a=1,f=1,m=0;
    for(let i=0;i<oct;i++){t+=this.noise(x*f,y*f)*a;m+=a;a*=gain;f*=lac;}
    return t/m;
  }
  ridged(x,y,oct=4,lac=2,gain=0.5){
    let t=0,a=1,f=1,m=0;
    for(let i=0;i<oct;i++){let n=this.noise(x*f,y*f);n=1-Math.abs(n*2);n*=n;t+=n*a;m+=a;a*=gain;f*=lac;}
    return t/m;
  }
}

const MAT_COLORS = {
  Grass:[106,127,63], LeafyGrass:[115,132,74], Sand:[143,126,95], Rock:[102,108,111],
  Slate:[63,127,107], Snow:[195,199,218], Ice:[129,194,224], Glacier:[101,176,234],
  Mud:[58,46,36], Ground:[102,92,59], Sandstone:[137,90,71], Limestone:[206,173,148],
  Basalt:[80,80,80], CrackedLava:[232,156,74], Salt:[198,189,181], Water:[12,84,92],
};

// ═══ Init ═══
document.addEventListener('DOMContentLoaded', () => {
  renderPresets();
  updateSizeStats();
  renderPreview();
  showTab('preview');
  checkDB();
});

function renderPresets() {
  const el = document.getElementById('presetBtns');
  el.innerHTML = Object.entries(PRESETS).map(([k,v]) =>
    `<button class="preset-btn${config.preset===k?' active':''}" onclick="selectPreset('${k}')">${v.name}</button>`
  ).join('');
}

function selectPreset(key) {
  config.preset = key;
  if (key !== 'custom') {
    const p = PRESETS[key];
    Object.assign(config, { waterLevel:p.waterLevel, amplitude:p.amplitude, rivers:p.rivers??false,
      cavesEnabled:p.cavesEnabled??false, volcano:p.volcano??false, islandMode:p.islandMode??false, lighting:key });
    syncUI();
  }
  renderPresets();
  renderPreview();
}

function syncUI() {
  document.getElementById('cfgAmplitude').value = config.amplitude;
  document.getElementById('cfgWaterLevel').value = config.waterLevel;
  document.getElementById('lblAmplitude').textContent = `Amplitude: ${config.amplitude.toFixed(2)}`;
  document.getElementById('lblWaterLevel').textContent = `Nível d'água: ${(config.waterLevel*100).toFixed(0)}%`;
  ['islandMode','rivers','cavesEnabled','volcano','placeTrees','placeRocks'].forEach(k => {
    const btn = document.getElementById('tog' + k.charAt(0).toUpperCase() + k.slice(1));
    if(btn) btn.className = 'toggle' + (config[k] ? ' on' : '');
  });
}

function updateConfig(key, val) { config[key] = val; }
function updateSlider(key, el) {
  config[key] = +el.value;
  const lbl = document.getElementById('lbl' + key.charAt(0).toUpperCase() + key.slice(1));
  if(lbl) {
    const v = +el.value;
    if(key==='waterLevel') lbl.textContent = `Nível d'água: ${(v*100).toFixed(0)}%`;
    else if(key==='octaves') lbl.textContent = `Octaves: ${v}`;
    else lbl.textContent = lbl.textContent.split(':')[0] + ': ' + v.toFixed(key==='scale'?3:2);
  }
  renderPreview();
}
function toggleFeature(key, btn) {
  config[key] = !config[key];
  btn.className = 'toggle' + (config[key] ? ' on' : '');
  // Mostrar/esconder opções
  const optMap = { placeTrees:'treeOptions', placeRocks:'rockOptions', cavesEnabled:'caveOptions' };
  if (optMap[key]) {
    const el = document.getElementById(optMap[key]);
    if (el) el.style.display = config[key] ? 'block' : 'none';
  }
  renderPreview();
}
function randomSeed() {
  config.seed = Math.floor(Math.random() * 99999);
  document.getElementById('cfgSeed').value = config.seed;
  renderPreview();
}
function randomFeature(seedKey) {
  config[seedKey] = Math.floor(Math.random() * 99999);
  renderPreview();
}
function randomAllFeatures() {
  config.seed = Math.floor(Math.random() * 99999);
  config.treeSeed = Math.floor(Math.random() * 99999);
  config.rockSeed = Math.floor(Math.random() * 99999);
  config.caveSeed = Math.floor(Math.random() * 99999);
  config.riverSeed = Math.floor(Math.random() * 99999);
  document.getElementById('cfgSeed').value = config.seed;
  renderPreview();
}
function updateSizeStats() {
  const s = SIZES[config.size] || SIZES.medium;
  document.getElementById('sizeStats').innerHTML = `
    <div class="stat"><span class="stat-val">${s[1]}²</span>studs</div>
    <div class="stat"><span class="stat-val">${s[0]}²</span>voxels</div>
    <div class="stat"><span class="stat-val">${(s[1]*s[1]/1e6).toFixed(1)}M</span>área</div>`;

// ═══ Canvas Preview ═══
let render3DTimer = null;
function renderPreview() {
  if(currentTab !== 'preview') return;
  if (is3D) {
    if (render3DTimer) clearTimeout(render3DTimer);
    render3DTimer = setTimeout(() => { if(document.getElementById('canvas3DContainer')) render3DPreview(); }, 150);
    return;
  }
  const canvas = document.getElementById('previewCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const p1=new Perlin(config.seed), p2=new Perlin(config.seed+500), p3=new Perlin(config.seed+1000);
  const img = ctx.createImageData(W,H);
  const d = img.data;
  for(let py=0;py<H;py++) for(let px=0;px<W;px++) {
    const nx=px/W, ny=py/H, sx=nx*8, sy=ny*8;
    let h=(p1.fbm(sx,sy,config.octaves,config.lacunarity,config.gain)+1)*0.5;
    const ridge=p1.ridged(sx*0.5,sy*0.5,4,config.lacunarity,config.gain);
    if(ridge>config.mountainThreshold) h+=(ridge-config.mountainThreshold)*config.mountainAmplitude;
    h*=config.amplitude;
    if(config.islandMode){const cx=nx-0.5,cy=ny-0.5;h*=Math.max(0,1-Math.pow(Math.sqrt(cx*cx+cy*cy)*2,1.5));}
    if(config.volcano&&h>0.75){const cx=nx-0.5,cy=ny-0.5;if(Math.sqrt(cx*cx+cy*cy)<0.08) h*=0.4;}
    h=Math.max(0,Math.min(1,h));
    let r,g,b;
    const temp=(p2.noise(sx*0.3,sy*0.3)+1)*0.5;
    if(h<config.waterLevel){const dp=1-h/config.waterLevel;r=12-dp*8|0;g=84-dp*40|0;b=92+dp*30|0;}
    else if(h<config.waterLevel+0.04)[r,g,b]=MAT_COLORS.Sand;
    else if(h>0.88)[r,g,b]=MAT_COLORS.Snow;
    else if(h>0.78){const t=(h-0.78)/0.1;[r,g,b]=MAT_COLORS.Rock.map((v,i)=>v+(MAT_COLORS.Snow[i]-v)*t|0);}
    else if(h>0.68)[r,g,b]=MAT_COLORS.Rock;
    else if(config.preset==='desert'){
      // Dunas com noise extra para variação
      const duneN = (p3.noise(sx*1.5, sy*1.5)+1)*0.5;
      const erosion = (p2.noise(sx*0.8, sy*0.8)+1)*0.5;
      // Oásis — pequenas manchas verdes/água
      const oasisN = p3.noise(sx*0.2, sy*0.2);
      if(oasisN > 0.42) { [r,g,b] = oasisN > 0.47 ? MAT_COLORS.Water : [80, 110, 50]; }
      // Mesas rochosas em altitudes altas
      else if(h>0.55) { [r,g,b] = MAT_COLORS.Sandstone; }
      // Cascalho/terra nas encostas
      else if(erosion > 0.65 && h > 0.3) { [r,g,b] = MAT_COLORS.Ground; }
      // Dunas — variação de tom na areia
      else {
        const shade = 0.85 + duneN * 0.3;
        r = Math.floor(MAT_COLORS.Sand[0] * shade);
        g = Math.floor(MAT_COLORS.Sand[1] * shade);
        b = Math.floor(MAT_COLORS.Sand[2] * shade);
      }
    }
    else if(config.preset==='arctic'){
      // Ártico mais variado
      const iceN = (p3.noise(sx*0.6, sy*0.6)+1)*0.5;
      if(h>0.6) [r,g,b] = MAT_COLORS.Glacier;
      else if(iceN > 0.6) [r,g,b] = MAT_COLORS.Ice;
      else if(iceN < 0.3 && h > 0.35) [r,g,b] = MAT_COLORS.Rock;
      else [r,g,b] = MAT_COLORS.Snow;
    }
    else if(config.volcano&&h>0.6)[r,g,b]=MAT_COLORS.CrackedLava;
    else if(temp>0.65)[r,g,b]=MAT_COLORS.Sand;
    else if(temp<0.35)[r,g,b]=MAT_COLORS.LeafyGrass;
    else [r,g,b]=MAT_COLORS.Grass;
    if(config.rivers&&h>config.waterLevel){const rn=p1.noise(px*0.03,py*0.03+config.seed*0.1);if(Math.abs(rn)<0.015)[r,g,b]=MAT_COLORS.Water;}
    const idx=(py*W+px)*4;d[idx]=r;d[idx+1]=g;d[idx+2]=b;d[idx+3]=255;
  }
  ctx.putImageData(img,0,0);

  // ═══ OVERLAYS: árvores, pedras, cavernas, vulcão ═══
  const p4 = new Perlin(config.seed + config.treeSeed);
  const p5 = new Perlin(config.seed + config.rockSeed);
  const p6 = new Perlin(config.seed + config.caveSeed);

  // Função helper pra calcular altura num ponto
  function getH(px, py) {
    const nx=px/W, ny=py/H, sx=nx*8, sy=ny*8;
    let h=(p1.fbm(sx,sy,config.octaves,config.lacunarity,config.gain)+1)*0.5;
    const ridge=p1.ridged(sx*0.5,sy*0.5,4,config.lacunarity,config.gain);
    if(ridge>config.mountainThreshold) h+=(ridge-config.mountainThreshold)*config.mountainAmplitude;
    h*=config.amplitude;
    if(config.islandMode){const cx=nx-0.5,cy=ny-0.5;h*=Math.max(0,1-Math.pow(Math.sqrt(cx*cx+cy*cy)*2,1.5));}
    return Math.max(0,Math.min(1,h));
  }

  // 🌋 Vulcão — cratera com glow
  if (config.volcano) {
    const vcx = W * 0.5, vcy = H * 0.5;
    const craterR = W * 0.04;
    const glowR = W * 0.12;
    // Glow laranja
    const grad = ctx.createRadialGradient(vcx, vcy, craterR, vcx, vcy, glowR);
    grad.addColorStop(0, 'rgba(255, 100, 0, 0.4)');
    grad.addColorStop(0.5, 'rgba(232, 156, 74, 0.15)');
    grad.addColorStop(1, 'rgba(232, 156, 74, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(vcx - glowR, vcy - glowR, glowR * 2, glowR * 2);
    // Cratera
    ctx.beginPath();
    ctx.arc(vcx, vcy, craterR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(200, 60, 0, 0.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 120, 0, 0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 🕳️ Cavernas — manchas escuras semi-transparentes
  if (config.cavesEnabled) {
    ctx.globalAlpha = 0.35;
    for (let px = 0; px < W; px += 6) {
      for (let py = 0; py < H; py += 6) {
        const h = getH(px, py);
        if (h > config.waterLevel && h < 0.75) {
          const caveN = p6.noise(px * 0.05, py * 0.05);
          if (caveN > config.caveThreshold * 0.8) {
            const size = 2 + (caveN - config.caveThreshold * 0.8) * 20;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(px, py, Math.min(size, 5), 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // 🌳 Árvores — pontos verdes
  if (config.placeTrees) {
    for (let px = 0; px < W; px += 4) {
      for (let py = 0; py < H; py += 4) {
        const h = getH(px, py);
        if (h > config.waterLevel + 0.04 && h < 0.75) {
          const tn = p4.noise(px * 0.1, py * 0.1);
          const temp = (p2.noise(px/W*8*0.3, py/H*8*0.3)+1)*0.5;
          let density = config.treeDensity;
          if (temp > 0.4 && temp < 0.7) density *= 3; // floresta
          if (config.preset === 'desert' || config.preset === 'arctic') density *= 0.1;

          if (tn > (1 - density * 20)) {
            const size = 1.5 + Math.random() * 1.5;
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.arc(px + 1, py + 1, size, 0, Math.PI * 2);
            ctx.fill();
            // Árvore
            ctx.fillStyle = temp > 0.6 ? '#2d5a1e' : '#3a7a2a';
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  // 🪨 Pedras — pontos cinza
  if (config.placeRocks) {
    for (let px = 0; px < W; px += 6) {
      for (let py = 0; py < H; py += 6) {
        const h = getH(px, py);
        if (h > config.waterLevel + 0.02 && h < 0.9) {
          const rn = p5.noise(px * 0.15, py * 0.15);
          if (rn > (1 - config.rockDensity * 40)) {
            const size = 1 + Math.random() * 1.5;
            ctx.fillStyle = 'rgba(140,140,140,0.7)';
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }
}

// ═══ Generate ═══
async function generateMap() {
  const btn = document.getElementById('btnGenerate');
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  btn.disabled = true; btn.textContent = '⏳ Gerando...';
  bar.style.display = 'block'; fill.style.width = '10%';

  const name = document.getElementById('mapName').value || 'Mapa ' + new Date().toLocaleString('pt-BR');

  // Animação de progresso
  let pct = 10;
  const iv = setInterval(() => { pct = Math.min(90, pct + Math.random()*15); fill.style.width = pct+'%'; }, 150);

  try {
    const res = await fetch(API + '?action=generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config, name })
    });
    const data = await res.json();

    clearInterval(iv);
    fill.style.width = '100%';

    if (data.ok) {
      generatedLua = data.data.lua_script;
      generatedJSON = JSON.stringify(config, null, 2);
      setTimeout(() => { switchTab('lua', document.querySelectorAll('.tab')[1]); }, 300);
    } else {
      // Fallback: gerar localmente se API falhar
      generatedLua = '-- API offline, gerando localmente...\n-- Config: ' + JSON.stringify(config, null, 2);
      generatedJSON = JSON.stringify(config, null, 2);
      alert('API offline — script gerado localmente. Configure o banco de dados primeiro.');
      switchTab('lua', document.querySelectorAll('.tab')[1]);
    }
  } catch(e) {
    clearInterval(iv);
    // Gerar localmente como fallback
    generatedJSON = JSON.stringify({ generator:'RobloxMapArchitect', version:'1.0', ...config }, null, 2);
    generatedLua = `-- Gerado localmente (API offline)\n-- Configure: api/?action=install\n-- Config: seed=${config.seed}, size=${config.size}, preset=${config.preset}\n`;
    switchTab('json', document.querySelectorAll('.tab')[2]);
  }

  btn.disabled = false; btn.textContent = '⚡ GERAR MAPA';
  setTimeout(() => { bar.style.display = 'none'; }, 500);
}

// ═══ Zoom & Pan do Mapa ═══
let mapZoom = 1;
let mapPanX = 0, mapPanY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

function zoomMap(dir) {
  if (dir === 0) { mapZoom = 1; mapPanX = 0; mapPanY = 0; }
  else if (dir > 0) { mapZoom = Math.min(5, mapZoom + 0.25); }
  else { mapZoom = Math.max(0.5, mapZoom - 0.25); }
  if (mapZoom <= 1) { mapPanX = 0; mapPanY = 0; }
  applyMapTransform();
}

function applyMapTransform() {
  const canvas = document.getElementById('previewCanvas');
  if (!canvas) return;
  canvas.style.transform = `scale(${mapZoom}) translate(${mapPanX}px, ${mapPanY}px)`;
  const label = document.getElementById('zoomLevel');
  if (label) label.textContent = Math.round(mapZoom * 100) + '%';
}

function initMapZoom() {
  const container = document.getElementById('canvasContainer');
  if (!container) return;

  // Scroll zoom
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (e.deltaY < 0) zoomMap(1);
    else zoomMap(-1);
  }, { passive: false });

  // Drag pan
  container.addEventListener('mousedown', function(e) {
    if (mapZoom <= 1) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    panStartX = mapPanX;
    panStartY = mapPanY;
    container.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const dx = (e.clientX - dragStartX) / mapZoom;
    const dy = (e.clientY - dragStartY) / mapZoom;
    const limit = 100;
    mapPanX = Math.max(-limit, Math.min(limit, panStartX + dx));
    mapPanY = Math.max(-limit, Math.min(limit, panStartY + dy));
    applyMapTransform();
  });

  document.addEventListener('mouseup', function() {
    isDragging = false;
    const container = document.getElementById('canvasContainer');
    if (container) container.style.cursor = mapZoom > 1 ? 'grab' : 'grab';
  });

  // Touch support (mobile)
  let lastTouchDist = 0;
  container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1 && mapZoom > 1) {
      isDragging = true;
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      panStartX = mapPanX;
      panStartY = mapPanY;
    }
    if (e.touches.length === 2) {
      lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });

  container.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && isDragging) {
      const dx = (e.touches[0].clientX - dragStartX) / mapZoom;
      const dy = (e.touches[0].clientY - dragStartY) / mapZoom;
      mapPanX = Math.max(-100, Math.min(100, panStartX + dx));
      mapPanY = Math.max(-100, Math.min(100, panStartY + dy));
      applyMapTransform();
    }
    if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (Math.abs(dist - lastTouchDist) > 10) {
        if (dist > lastTouchDist) zoomMap(1);
        else zoomMap(-1);
        lastTouchDist = dist;
      }
    }
  }, { passive: true });

  container.addEventListener('touchend', function() { isDragging = false; });
}

// ═══ Util ═══
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard?.writeText(el.textContent);
  const btn = el.previousElementSibling?.querySelector('.btn-copy') || document.querySelector('.btn-copy');

}

// Orbit state
let orbit = { theta: Math.PI*0.25, phi: Math.PI*0.3, radius: 220, targetX:0, targetY:12, targetZ:0, dragging:false, rightDrag:false, lastX:0, lastY:0, lastTouchDist:0 };

function toggle3D(val) {
  is3D = val;
  showTab('preview');
}

function cleanup3D() {
  if (animFrame3D) { cancelAnimationFrame(animFrame3D); animFrame3D = null; }
  if (renderer3D) {
    renderer3D.dispose();
    renderer3D.forceContextLoss();
    const c = renderer3D.domElement;
    if (c && c.parentNode) c.parentNode.removeChild(c);
    renderer3D = null;
  }
  if (scene3D) {
    scene3D.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (obj.material.map) obj.material.map.dispose();
        obj.material.dispose();
      }
    });
    scene3D = null;
  }
  camera3D = null;
}

function reset3DCamera() {
  orbit.theta = Math.PI*0.25; orbit.phi = Math.PI*0.3; orbit.radius = 220;
  orbit.targetX = 0; orbit.targetY = 12; orbit.targetZ = 0;
}

function getTerrainHeight(nx, ny, p1) {
  const sx = nx*8, sy = ny*8;
  let h = (p1.fbm(sx, sy, config.octaves, config.lacunarity, config.gain)+1)*0.5;
  const ridge = p1.ridged(sx*0.5, sy*0.5, 4, config.lacunarity, config.gain);
  if (ridge > config.mountainThreshold) h += (ridge - config.mountainThreshold) * config.mountainAmplitude;
  h *= config.amplitude;
  if (config.islandMode) {
    const cx = nx-0.5, cy = ny-0.5;
    h *= Math.max(0, 1 - Math.pow(Math.sqrt(cx*cx + cy*cy)*2, 1.5));
  }
  if (config.volcano && h > 0.75) {
    const cx = nx-0.5, cy = ny-0.5;
    if (Math.sqrt(cx*cx + cy*cy) < 0.08) h *= 0.4;
  }
  return Math.max(0, Math.min(1, h));
}

function render3DPreview() {
  cleanup3D();
  const container = document.getElementById('canvas3DContainer');
  if (!container) return;

  const width = container.clientWidth || 600;
  const height = container.clientHeight || 600;

  // ── Scene ──
  scene3D = new THREE.Scene();
  scene3D.background = new THREE.Color(0x0a0e14);
  scene3D.fog = new THREE.FogExp2(0x0a0e14, 0.0015);

  // ── Camera ──
  camera3D = new THREE.PerspectiveCamera(55, width/height, 0.5, 1200);

  // ── Renderer ──
  renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer3D.setSize(width, height);
  renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer3D.shadowMap.enabled = true;
  renderer3D.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer3D.domElement);

  // ── Lights ──
  const ambient = new THREE.AmbientLight(0x506080, 0.5);
  scene3D.add(ambient);
  const hemi = new THREE.HemisphereLight(0x87ceeb, 0x444422, 0.4);
  scene3D.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.0);
  sun.position.set(80, 140, 60);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
  sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
  scene3D.add(sun);

  // ── Generate terrain data ──
  const RES = 180;
  const WORLD = 200;
  const HEIGHT_SCALE = 55;
  const p1 = new Perlin(config.seed);
  const p2 = new Perlin(config.seed + 500);
  const p3 = new Perlin(config.seed + 1000);

  // Offscreen canvas for texture
  const texCanvas = document.createElement('canvas');
  texCanvas.width = RES; texCanvas.height = RES;
  const texCtx = texCanvas.getContext('2d');
  const texImg = texCtx.createImageData(RES, RES);
  const td = texImg.data;

  const heights = new Float32Array(RES * RES);

  for (let iy = 0; iy < RES; iy++) {
    for (let ix = 0; ix < RES; ix++) {
      const nx = ix/RES, ny = iy/RES;
      const sx = nx*8, sy = ny*8;
      const h = getTerrainHeight(nx, ny, p1);
      heights[iy*RES + ix] = h;

      // Color — same logic as 2D
      let r, g, b;
      const temp = (p2.noise(sx*0.3, sy*0.3)+1)*0.5;
      if (h < config.waterLevel) {
        const dp = 1 - h/config.waterLevel;
        r = 12-dp*8|0; g = 84-dp*40|0; b = 92+dp*30|0;
      } else if (h < config.waterLevel+0.04) { [r,g,b] = MAT_COLORS.Sand; }
      else if (h > 0.88) { [r,g,b] = MAT_COLORS.Snow; }
      else if (h > 0.78) { const t=(h-0.78)/0.1; [r,g,b]=MAT_COLORS.Rock.map((v,i)=>v+(MAT_COLORS.Snow[i]-v)*t|0); }
      else if (h > 0.68) { [r,g,b] = MAT_COLORS.Rock; }
      else if (config.preset==='desert') {
        const duneN=(p3.noise(sx*1.5,sy*1.5)+1)*0.5, erosion=(p2.noise(sx*0.8,sy*0.8)+1)*0.5, oasisN=p3.noise(sx*0.2,sy*0.2);
        if(oasisN>0.42){[r,g,b]=oasisN>0.47?MAT_COLORS.Water:[80,110,50];}
        else if(h>0.55){[r,g,b]=MAT_COLORS.Sandstone;}
        else if(erosion>0.65&&h>0.3){[r,g,b]=MAT_COLORS.Ground;}
        else{const s=0.85+duneN*0.3;r=MAT_COLORS.Sand[0]*s|0;g=MAT_COLORS.Sand[1]*s|0;b=MAT_COLORS.Sand[2]*s|0;}
      }
      else if (config.preset==='arctic') {
        const iceN=(p3.noise(sx*0.6,sy*0.6)+1)*0.5;
        if(h>0.6)[r,g,b]=MAT_COLORS.Glacier;
        else if(iceN>0.6)[r,g,b]=MAT_COLORS.Ice;
        else if(iceN<0.3&&h>0.35)[r,g,b]=MAT_COLORS.Rock;
        else [r,g,b]=MAT_COLORS.Snow;
      }
      else if (config.volcano && h > 0.6) { [r,g,b] = MAT_COLORS.CrackedLava; }
      else if (temp > 0.65) { [r,g,b] = MAT_COLORS.Sand; }
      else if (temp < 0.35) { [r,g,b] = MAT_COLORS.LeafyGrass; }
      else { [r,g,b] = MAT_COLORS.Grass; }
      // Rivers
      if (config.rivers && h > config.waterLevel) {
        const rn = p1.noise(ix*(512/RES)*0.03, iy*(512/RES)*0.03 + config.seed*0.1);
        if (Math.abs(rn) < 0.015) { [r,g,b] = MAT_COLORS.Water; }
      }
      const idx = (iy*RES + ix)*4;
      td[idx]=r; td[idx+1]=g; td[idx+2]=b; td[idx+3]=255;
    }
  }
  texCtx.putImageData(texImg, 0, 0);

  // ── Build terrain mesh ──
  const geo = new THREE.PlaneGeometry(WORLD, WORLD, RES-1, RES-1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position.array;

  for (let iy = 0; iy < RES; iy++) {
    for (let ix = 0; ix < RES; ix++) {
      const vi = iy * RES + ix;
      const h = heights[vi];
      pos[vi*3 + 1] = h * HEIGHT_SCALE;
    }
  }
  geo.computeVertexNormals();

  const texture = new THREE.CanvasTexture(texCanvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  const terrainMat = new THREE.MeshLambertMaterial({ map: texture });
  const terrain = new THREE.Mesh(geo, terrainMat);
  terrain.receiveShadow = true;
  scene3D.add(terrain);

  // ── Water plane ──
  if (config.waterLevel > 0.01) {
    const waterGeo = new THREE.PlaneGeometry(WORLD*1.3, WORLD*1.3);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshPhongMaterial({
      color: 0x0c545c, transparent: true, opacity: 0.72,
      shininess: 90, specular: 0x336688,
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = config.waterLevel * HEIGHT_SCALE;
    water.receiveShadow = true;
    scene3D.add(water);
  }

  // ── Volcano glow ──
  if (config.volcano) {
    const glowGeo = new THREE.SphereGeometry(5, 16, 8);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.5 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    const vH = getTerrainHeight(0.5, 0.5, p1);
    glow.position.set(0, vH * HEIGHT_SCALE + 2, 0);
    scene3D.add(glow);
    // Lava light
    const lavaLight = new THREE.PointLight(0xff4400, 1.5, 60);
    lavaLight.position.copy(glow.position);
    scene3D.add(lavaLight);
  }

  // ── Trees (InstancedMesh) ──
  if (config.placeTrees) {
    const p4 = new Perlin(config.seed + config.treeSeed);
    const treePos = [];
    const step = 3;
    for (let iy = 0; iy < RES; iy += step) {
      for (let ix = 0; ix < RES; ix += step) {
        const h = heights[iy*RES + ix];
        if (h > config.waterLevel+0.04 && h < 0.75) {
          const nx = ix/RES, ny = iy/RES;
          const tn = p4.noise(nx*80*0.1, ny*80*0.1);
          const temp = (p2.noise(nx*8*0.3, ny*8*0.3)+1)*0.5;
          let density = config.treeDensity;
          if (temp > 0.4 && temp < 0.7) density *= 3;
          if (config.preset==='desert'||config.preset==='arctic') density *= 0.1;
          if (tn > (1 - density*20)) {
            treePos.push({
              x: (ix/RES - 0.5) * WORLD,
              y: h * HEIGHT_SCALE,
              z: (iy/RES - 0.5) * WORLD,
              s: 0.6 + Math.random()*0.6
            });
          }
        }
      }
    }
    if (treePos.length > 0) {
      const maxT = Math.min(treePos.length, 800);
      const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 2.2, 5);
      const leafGeo = new THREE.SphereGeometry(1.3, 5, 4);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3d2b });
      const leafMat = new THREE.MeshLambertMaterial({ color: 0x2d6b1e });
      const trunkIM = new THREE.InstancedMesh(trunkGeo, trunkMat, maxT);
      const leafIM = new THREE.InstancedMesh(leafGeo, leafMat, maxT);
      trunkIM.castShadow = true; leafIM.castShadow = true;
      const mat4 = new THREE.Matrix4();
      for (let i = 0; i < maxT; i++) {
        const t = treePos[i];
        mat4.makeScale(t.s, t.s, t.s);
        mat4.setPosition(t.x, t.y + 1.1*t.s, t.z);
        trunkIM.setMatrixAt(i, mat4);
        mat4.setPosition(t.x, t.y + 2.8*t.s, t.z);
        leafIM.setMatrixAt(i, mat4);
      }
      scene3D.add(trunkIM);
      scene3D.add(leafIM);
    }
  }

  // ── Rocks (InstancedMesh) ──
  if (config.placeRocks) {
    const p5 = new Perlin(config.seed + config.rockSeed);
    const rockPos = [];
    for (let iy = 0; iy < RES; iy += 4) {
      for (let ix = 0; ix < RES; ix += 4) {
        const h = heights[iy*RES + ix];
        if (h > config.waterLevel+0.02 && h < 0.9) {
          const nx = ix/RES, ny = iy/RES;
          const rn = p5.noise(nx*80*0.15, ny*80*0.15);
          if (rn > (1 - config.rockDensity*40)) {
            rockPos.push({
              x: (ix/RES-0.5)*WORLD,
              y: h*HEIGHT_SCALE,
              z: (iy/RES-0.5)*WORLD,
              s: 0.4 + Math.random()*0.7
            });
          }
        }
      }
    }
    if (rockPos.length > 0) {
      const maxR = Math.min(rockPos.length, 500);
      const rockGeo = new THREE.IcosahedronGeometry(0.7, 0);
      const rockMat = new THREE.MeshLambertMaterial({ color: 0x7a7a7a });
      const rockIM = new THREE.InstancedMesh(rockGeo, rockMat, maxR);
      rockIM.castShadow = true;
      const mat4 = new THREE.Matrix4();
      for (let i = 0; i < maxR; i++) {
        const r = rockPos[i];
        mat4.makeScale(r.s, r.s*0.7, r.s);
        mat4.setPosition(r.x, r.y + 0.2, r.z);
        rockIM.setMatrixAt(i, mat4);
      }
      scene3D.add(rockIM);
    }
  }

  // ── Grid helper (subtle) ──
  const gridH = new THREE.GridHelper(WORLD, 20, 0x1a2233, 0x1a2233);
  gridH.position.y = -0.5;
  scene3D.add(gridH);

  // ── Orbit controls ──
  reset3DCamera();
  init3DControls(container);

  // ── Animate ──
  function animate() {
    animFrame3D = requestAnimationFrame(animate);
    update3DCamera();
    renderer3D.render(scene3D, camera3D);
  }
  animate();

  // ── Resize ──
  const ro = new ResizeObserver(() => {
    if (!renderer3D || !camera3D) return;
    const w = container.clientWidth, h = container.clientHeight;
    if (w > 0 && h > 0) {
      camera3D.aspect = w / h;
      camera3D.updateProjectionMatrix();
      renderer3D.setSize(w, h);
    }
  });
  ro.observe(container);
}

function update3DCamera() {
  if (!camera3D) return;
  camera3D.position.x = orbit.targetX + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta);
  camera3D.position.y = orbit.targetY + orbit.radius * Math.cos(orbit.phi);
  camera3D.position.z = orbit.targetZ + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta);
  camera3D.lookAt(orbit.targetX, orbit.targetY, orbit.targetZ);
}

function init3DControls(el) {
  el.addEventListener('mousedown', e => {
    orbit.dragging = true;
    orbit.rightDrag = e.button === 2;
    orbit.lastX = e.clientX; orbit.lastY = e.clientY;
    e.preventDefault();
  });
  el.addEventListener('contextmenu', e => e.preventDefault());

  const onMove = e => {
    if (!orbit.dragging) return;
    const dx = e.clientX - orbit.lastX, dy = e.clientY - orbit.lastY;
    orbit.lastX = e.clientX; orbit.lastY = e.clientY;
    if (orbit.rightDrag) {
      // Pan
      const sp = orbit.radius * 0.002;
      const sinT = Math.sin(orbit.theta), cosT = Math.cos(orbit.theta);
      orbit.targetX += (-dx * sinT - dy * cosT * Math.cos(orbit.phi)) * sp * 0.5;
      orbit.targetZ += (dx * cosT - dy * sinT * Math.cos(orbit.phi)) * sp * 0.5;
      orbit.targetY += dy * Math.sin(orbit.phi) * sp * 0.3;
    } else {
      orbit.theta -= dx * 0.006;
      orbit.phi = Math.max(0.08, Math.min(Math.PI*0.48, orbit.phi - dy * 0.006));
    }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', () => { orbit.dragging = false; });

  el.addEventListener('wheel', e => {
    e.preventDefault();
    orbit.radius *= e.deltaY > 0 ? 1.08 : 0.92;
    orbit.radius = Math.max(25, Math.min(700, orbit.radius));
  }, { passive: false });

  // Touch
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      orbit.dragging = true; orbit.rightDrag = false;
      orbit.lastX = e.touches[0].clientX; orbit.lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      orbit.lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && orbit.dragging) {
      const dx = e.touches[0].clientX - orbit.lastX, dy = e.touches[0].clientY - orbit.lastY;
      orbit.lastX = e.touches[0].clientX; orbit.lastY = e.touches[0].clientY;
      orbit.theta -= dx * 0.006;
      orbit.phi = Math.max(0.08, Math.min(Math.PI*0.48, orbit.phi - dy * 0.006));
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if (Math.abs(dist - orbit.lastTouchDist) > 5) {
        orbit.radius *= dist > orbit.lastTouchDist ? 0.95 : 1.05;
        orbit.radius = Math.max(25, Math.min(700, orbit.radius));
        orbit.lastTouchDist = dist;
      }
    }
  }, { passive: true });
  el.addEventListener('touchend', () => { orbit.dragging = false; });
}
